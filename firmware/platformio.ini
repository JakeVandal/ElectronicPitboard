[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_psram = 64000000L
board_build.partitions = default_16MB.csv
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
extra_scripts =
  pre:copy_lv_conf.py
lib_deps =
  lovyan03/LovyanGFX @ ^1.1.15
  lvgl/lvgl @ ^8.3.11
  bblanchon/ArduinoJson @ ^7.0.0
  ricmoo/QRCode @ ^0.0.1

[env:esp32s3_test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_psram = 64000000L
board_build.partitions = default_16MB.csv
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
build_src_filter =
  +<*>
  -<main.cpp>
extra_scripts =
  pre:copy_lv_conf.py
lib_deps =
  lovyan03/LovyanGFX @ ^1.1.15
  lvgl/lvgl @ ^8.3.11
  bblanchon/ArduinoJson @ ^7.0.0
  ricmoo/QRCode @ ^0.0.1
